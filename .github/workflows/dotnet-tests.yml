name: .NET Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore src/MagacinERP.Core/MagacinERP.Core.csproj && dotnet restore src/MagacinERP.Services/MagacinERP.Services.csproj && dotnet restore tests/MagacinERP.Tests/MagacinERP.Tests.csproj

    - name: Build
      run: dotnet build src/MagacinERP.Core/MagacinERP.Core.csproj --no-restore && dotnet build src/MagacinERP.Services/MagacinERP.Services.csproj --no-restore && dotnet build tests/MagacinERP.Tests/MagacinERP.Tests.csproj --no-restore

    - name: Test
      run: dotnet test tests/MagacinERP.Tests/MagacinERP.Tests.csproj --no-build --verbosity normal
